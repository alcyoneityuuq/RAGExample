<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 问答</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            height: 100vh;
            display: flex;
        }

        #sidebar {
            width: 25%;
            min-width: 220px;
            background-color: #212121;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            gap: 8px;
            overflow-y: auto;
        }

        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

        #sidebar-title {
            font-size: 15px;
            font-weight: 600;
            color: #aaa;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
        }

        .collapse-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background-color: #2a2a2a;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #ccc;
            user-select: none;
        }

        .collapse-header:hover { background-color: #333; }

        .collapse-arrow {
            font-size: 10px;
            color: #666;
            transition: transform 0.2s;
        }

        .collapse-arrow.open { transform: rotate(180deg); }

        .collapse-body {
            display: none;
            flex-direction: column;
            gap: 4px;
            padding: 8px 4px;
        }

        .collapse-body.open { display: flex; }

        .pdf-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 13px;
            color: #bbb;
        }

        .pdf-item:hover { background-color: #2a2a2a; }

        .pdf-item.selectable {
            cursor: pointer;
        }

        .pdf-item.selectable:hover { background-color: #2f3a2f; }

        .pdf-item.selected {
            background-color: #1e3a1e;
            color: #7ecf7e;
        }

        .pdf-icon { font-size: 14px; flex-shrink: 0; }

        .pdf-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .pdf-empty {
            font-size: 12px;
            color: #555;
            padding: 6px 10px;
        }

        .sidebar-btn {
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 8px;
            padding: 10px 12px;
            color: #e0e0e0;
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s;
            font-family: inherit;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-btn:hover { background-color: #333; }

        .sidebar-btn.danger:hover {
            background-color: #3a1a1a;
            border-color: #6a2a2a;
            color: #e07070;
        }

        .sidebar-btn.confirm {
            background-color: #1e3a1e;
            border-color: #2e5a2e;
            color: #7ecf7e;
            justify-content: center;
        }

        .sidebar-btn.confirm:hover { background-color: #254a25; }

        #file-input { display: none; }

        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #chat-container::-webkit-scrollbar { width: 6px; }
        #chat-container::-webkit-scrollbar-track { background: #1a1a1a; }
        #chat-container::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            gap: 6px;
        }

        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.assistant { align-self: flex-start; align-items: flex-start; }

        .message-label { font-size: 12px; color: #666; }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }

        .message.user .message-bubble {
            background-color: #2f6feb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background-color: #2a2a2a;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .typing .message-bubble::after {
            content: "▋";
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #input-area {
            padding: 16px 24px;
            background-color: #1a1a1a;
            border-top: 1px solid #2a2a2a;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        #input-box {
            flex: 1;
            background-color: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.6;
            max-height: 160px;
            overflow-y: auto;
            font-family: inherit;
        }

        #input-box::placeholder { color: #555; }
        #input-box:focus { border-color: #2f6feb; }

        .icon-btn {
            border: none;
            border-radius: 10px;
            width: 42px;
            height: 42px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background-color 0.2s;
        }

        #send-btn { background-color: #2f6feb; }
        #send-btn:hover { background-color: #1a5fd6; }
        #send-btn:disabled { background-color: #333; cursor: not-allowed; }

        #regen-btn { background-color: #2a2a2a; border: 1px solid #3a3a3a; }
        #regen-btn:hover { background-color: #333; }
        #regen-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #send-btn svg { fill: #fff; }
        #regen-btn svg { fill: #aaa; }

        .icon-btn svg { width: 18px; height: 18px; }

        #empty-hint { margin: auto; color: #444; font-size: 14px; }
    </style>
</head>
<body>

<div id="sidebar">
    <div id="sidebar-title">设置</div>

    <!-- PDF 文件 -->
    <div class="collapse-header" id="pdf-list-header">
        <span>PDF 文件</span>
        <span class="collapse-arrow" id="pdf-list-arrow">▼</span>
    </div>
    <div class="collapse-body" id="pdf-list-body">
        <div class="pdf-empty" id="pdf-list-empty">暂无文件</div>
    </div>

    <input type="file" id="file-input" accept=".pdf" multiple>
    <button class="sidebar-btn" id="upload-btn">
        <span>＋</span> 上传 PDF 文件
    </button>

    <button class="sidebar-btn danger" id="delete-btn">
        <span>🗑</span> 删除所有 PDF
    </button>

    <!-- 向量库内 PDF -->
    <div class="collapse-header" id="vec-list-header">
        <span>向量库内 PDF</span>
        <span class="collapse-arrow" id="vec-list-arrow">▼</span>
    </div>
    <div class="collapse-body" id="vec-list-body">
        <div class="pdf-empty" id="vec-list-empty">向量库为空</div>
    </div>

    <!-- 将 PDF 向量化 -->
    <div class="collapse-header" id="vec-select-header">
        <span>将 PDF 文件向量化</span>
        <span class="collapse-arrow" id="vec-select-arrow">▼</span>
    </div>
    <div class="collapse-body" id="vec-select-body">
        <div class="pdf-empty" id="vec-select-empty">暂无文件</div>
        <button class="sidebar-btn confirm" id="vectorize-btn" style="margin-top: 4px;">确认向量化</button>
    </div>

    <button class="sidebar-btn danger" id="clear-vec-btn">
        <span>🗑</span> 清空向量库
    </button>

    <button class="sidebar-btn danger" id="clear-chat-btn">
        <span>✕</span> 清空对话
    </button>
</div>

<div id="main">
    <div id="chat-container">
        <div id="empty-hint">输入问题开始对话</div>
    </div>

    <div id="input-area">
        <textarea id="input-box" placeholder="输入问题..." rows="1"></textarea>
        <button class="icon-btn" id="regen-btn" disabled title="重新生成">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        </button>
        <button class="icon-btn" id="send-btn" title="发送">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>
</div>

<script>
    const BASE_URL = "http://127.0.0.1:8001";

    // 折叠控制
    function initCollapse(headerId, bodyId, arrowId) {
        const header = document.getElementById(headerId);
        const body = document.getElementById(bodyId);
        const arrow = document.getElementById(arrowId);
        header.addEventListener("click", () => {
            body.classList.toggle("open");
            arrow.classList.toggle("open");
        });
    }

    initCollapse("pdf-list-header", "pdf-list-body", "pdf-list-arrow");
    initCollapse("vec-list-header", "vec-list-body", "vec-list-arrow");
    initCollapse("vec-select-header", "vec-select-body", "vec-select-arrow");

    // 渲染 PDF 列表
    function renderList(bodyId, emptyId, items, selectable = false) {
        const body = document.getElementById(bodyId);
        const empty = document.getElementById(emptyId);
        body.querySelectorAll(".pdf-item").forEach(el => el.remove());

        if (items.length === 0) {
            empty.style.display = "block";
        } else {
            empty.style.display = "none";
            items.forEach(name => {
                const item = document.createElement("div");
                item.className = "pdf-item" + (selectable ? " selectable" : "");
                item.dataset.name = name;
                item.innerHTML = `<span class="pdf-icon">📄</span><span class="pdf-name">${name}</span>`;
                if (selectable) {
                    item.addEventListener("click", () => item.classList.toggle("selected"));
                }
                body.appendChild(item);
            });
        }
    }

    // 获取 PDF 列表
    async function fetchPdfs() {
        const res = await fetch(`${BASE_URL}/InquiryPDF`);
        const data = await res.json();
        renderList("pdf-list-body", "pdf-list-empty", data.pdfs);
        renderList("vec-select-body", "vec-select-empty", data.pdfs, true);
        // 确认按钮移到列表后面
        const body = document.getElementById("vec-select-body");
        body.appendChild(document.getElementById("vectorize-btn"));
    }

    // 获取向量库 PDF 列表
    async function fetchVecPdfs() {
        const res = await fetch(`${BASE_URL}/inquiryVecPDF`);
        const data = await res.json();
        renderList("vec-list-body", "vec-list-empty", data.pdfs);
    }

    fetchPdfs();
    fetchVecPdfs();

    // 上传 PDF（上限 10 个）
    const uploadBtn = document.getElementById("upload-btn");
    const fileInput = document.getElementById("file-input");

    uploadBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
        const files = Array.from(fileInput.files).slice(0, 10);
        for (const file of files) {
            const formData = new FormData();
            formData.append("file", file);
            await fetch(`${BASE_URL}/UploadPDF`, { method: "POST", body: formData });
        }
        fileInput.value = "";
        fetchPdfs();
    });

    // 删除所有 PDF
    document.getElementById("delete-btn").addEventListener("click", async () => {
        await fetch(`${BASE_URL}/deletePDF`, { method: "DELETE" });
        fetchPdfs();
    });

    // 向量化选中的 PDF
    document.getElementById("vectorize-btn").addEventListener("click", async () => {
        const selected = document.querySelectorAll("#vec-select-body .pdf-item.selected");
        if (selected.length === 0) return;
        const filenames = Array.from(selected).map(el => el.dataset.name);
        await fetch(`${BASE_URL}/PDFvector`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filenames })
        });
        fetchVecPdfs();
    });

    // 清空向量库
    document.getElementById("clear-vec-btn").addEventListener("click", async () => {
        await fetch(`${BASE_URL}/clearVec`, { method: "DELETE" });
        fetchVecPdfs();
    });

    // 清空对话
    document.getElementById("clear-chat-btn").addEventListener("click", () => {
        chatContainer.innerHTML = "";
        const hint = document.createElement("div");
        hint.id = "empty-hint";
        hint.textContent = "输入问题开始对话";
        chatContainer.appendChild(hint);
        lastUserMessage = null;
        regenBtn.disabled = true;
    });

    // 对话
    const chatContainer = document.getElementById("chat-container");
    const inputBox = document.getElementById("input-box");
    const sendBtn = document.getElementById("send-btn");
    const regenBtn = document.getElementById("regen-btn");
    let lastUserMessage = null;

    function setLoading(loading) {
        sendBtn.disabled = loading;
        inputBox.disabled = loading;
        regenBtn.disabled = loading;
    }

    function getHistory() {
        const messages = [];
        chatContainer.querySelectorAll(".message").forEach(el => {
            const role = el.classList.contains("user") ? "user" : "assistant";
            const content = el.querySelector(".message-bubble").textContent;
            messages.push({ role, content });
        });
        return messages;
    }

    async function requestAnswer(question) {
        setLoading(true);

        const wrapper = document.createElement("div");
        wrapper.className = "message assistant typing";
        const label = document.createElement("div");
        label.className = "message-label";
        label.textContent = "AI";
        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        wrapper.appendChild(label);
        wrapper.appendChild(bubble);
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        const history = getHistory();

        const res = await fetch(`${BASE_URL}/ai`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: history, question })
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        wrapper.classList.remove("typing");

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            bubble.textContent += decoder.decode(value);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        setLoading(false);
        regenBtn.disabled = false;
    }

    async function sendMessage() {
        const text = inputBox.value.trim();
        if (!text) return;

        lastUserMessage = text;

        const wrapper = document.createElement("div");
        wrapper.className = "message user";
        const label = document.createElement("div");
        label.className = "message-label";
        label.textContent = "你";
        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.textContent = text;
        wrapper.appendChild(label);
        wrapper.appendChild(bubble);
        const hint = document.getElementById("empty-hint");
        if (hint) hint.remove();
        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        inputBox.value = "";
        inputBox.style.height = "auto";

        await requestAnswer(text);
    }

    regenBtn.addEventListener("click", async () => {
        if (!lastUserMessage) return;
        const messages = chatContainer.querySelectorAll(".message.assistant");
        if (messages.length > 0) messages[messages.length - 1].remove();
        await requestAnswer(lastUserMessage);
    });

    sendBtn.addEventListener("click", sendMessage);

    inputBox.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    inputBox.addEventListener("input", () => {
        inputBox.style.height = "auto";
        inputBox.style.height = inputBox.scrollHeight + "px";
    });
</script>

</body>
</html>
